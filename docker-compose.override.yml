# Fork-local deployment overrides.
#
# Docker Compose loads this file automatically alongside docker-compose.yml, so
# every local customization lives here instead of patching the upstream file.
# That keeps `git log main..deploy` free of conflicts when upstream edits its
# own compose file.
#
# Values come from .env in this directory; copy deploy/.env.example to get
# started. Required secrets use ${VAR:?message} so a missing value fails fast
# instead of silently starting with the upstream demo password.
name: new-api

services:
  new-api:
    image: ${NEW_API_IMAGE:-calciumion/new-api:latest}
    # main.go waits up to SHUTDOWN_TIMEOUT_SECONDS for in-flight SSE streams;
    # Docker's 10s default would SIGKILL them long before that.
    stop_grace_period: 130s
    # !override replaces the upstream list instead of appending to it, which is
    # what keeps 3000 off the public interface: Caddy terminates TLS and reaches
    # the app over the compose network, and 127.0.0.1 stays available for
    # health checks and debugging from the host.
    ports: !override
      - "127.0.0.1:3000:3000"
    environment:
      - SQL_DSN=${SQL_DSN:?SQL_DSN is required}
      - LOG_SQL_DSN=${LOG_SQL_DSN:-}
      - LOG_SQL_CLICKHOUSE_TTL_DAYS=${LOG_SQL_CLICKHOUSE_TTL_DAYS:-0}
      - REDIS_CONN_STRING=${REDIS_CONN_STRING:?REDIS_CONN_STRING is required}
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET is required, otherwise every restart logs all users out}
      - SHUTDOWN_TIMEOUT_SECONDS=${SHUTDOWN_TIMEOUT_SECONDS:-120}
      - TZ=${TZ:-Asia/Shanghai}
      - ERROR_LOG_ENABLED=${ERROR_LOG_ENABLED:-true}
      - BATCH_UPDATE_ENABLED=${BATCH_UPDATE_ENABLED:-true}
      - NODE_NAME=${NODE_NAME:-new-api-node-1}
      - NODE_TYPE=${NODE_TYPE:-}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-}
      - SESSION_COOKIE_TRUSTED_URL=${SESSION_COOKIE_TRUSTED_URL:-}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      - STREAMING_TIMEOUT=${STREAMING_TIMEOUT:-}
      - RELAY_IDLE_CONN_TIMEOUT=${RELAY_IDLE_CONN_TIMEOUT:-}
      - SYNC_FREQUENCY=${SYNC_FREQUENCY:-}

  redis:
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]

  postgres:
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-new-api}

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Holds the Cloudflare Origin CA keypair. It lives outside the repository
      # so the private key can never be committed by accident.
      - ${CADDY_CERT_DIR:-/etc/new-api/certs}:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - APP_DOMAIN=${APP_DOMAIN:?APP_DOMAIN is required so Caddy knows which site to serve}
    depends_on:
      - new-api
    networks:
      - new-api-network

volumes:
  # Caddy's own state. The serving certificate comes from CADDY_CERT_DIR, so
  # losing this volume costs nothing, but Caddy expects both paths to be
  # writable and falls back to an ephemeral location with a warning otherwise.
  caddy_data:
  caddy_config:
